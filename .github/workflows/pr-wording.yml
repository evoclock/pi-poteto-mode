name: PR wording
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the lint from the base branch so a PR cannot weaken its own check.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint the PR title and body
        # Bootstrap: this logic stays inline because it runs from the base checkout,
        # where a helper script would be missing too. Only a missing lint passes;
        # the PR head's copy is never run. The lint reads only the event payload
        # and the optional config.
        run: |
          LINT=.github/tools/pr-wording/pr_wording_lint.py
          if [ ! -f "$LINT" ]; then
            echo "::notice title=PR wording::$LINT is not on the base branch yet, so the lint cannot run. This is expected only for the PR that adds it."
            exit 0
          fi
          # Generic base rules, plus the repo's own config if it commits one (also from base).
          ARGS=(--event "$GITHUB_EVENT_PATH")
          if [ -f .github/pr-wording.json ]; then ARGS+=(--config .github/pr-wording.json); fi
          python3 "$LINT" "${ARGS[@]}"
