name: PR review gate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  gate:
    # issue_comment fires for issues too; only run it for PR comments.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the gate from the base branch so a PR cannot weaken its own check.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Evaluate review freeze, comment tags and journey claims
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Optional maintainer list (comma-separated logins). When empty, the gate
          # reads collaborators with maintain or admin permission; if it cannot,
          # it stays strict. Only a PR by the sole maintainer skips the approval.
          PR_GATE_MAINTAINERS: ${{ vars.PR_GATE_MAINTAINERS }}
        # Bootstrap: this logic stays inline because it runs from the base checkout,
        # where a helper script would be missing too. Only a missing gate script
        # passes; the PR head's copy is never run.
        run: |
          GATE=.github/tools/pr_review_gate.js
          if [ ! -f "$GATE" ]; then
            echo "::notice title=PR review gate::$GATE is not on the base branch yet, so the gate cannot run. This is expected only for the PR that adds it."
            exit 0
          fi
          node "$GATE" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
